# /etc/systemd/system/ocserv.service.d/override.conf
[Unit]
After=network-online.target nftables.service unbound.service
Wants=network-online.target

[Service]
# Автоподъём при сбое.
Restart=on-failure
RestartSec=2s
StartLimitIntervalSec=60
StartLimitBurst=10

# Тысячи клиентов = тысячи сокетов и tun-устройств.
LimitNOFILE=1048576
LimitNPROC=65536
TasksMax=infinity

# Песочница systemd (дополнительно к chroot/seccomp самого ocserv).
ProtectSystem=full
ProtectHome=yes
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
LockPersonality=yes
RestrictRealtime=yes
# Файл TOTP-счётчиков (защита от повторного использования кода) обновляется
# ocserv'ом, поэтому /etc/ocserv остаётся доступным на запись.
ReadWritePaths=/etc/ocserv /var/lib/ocserv
